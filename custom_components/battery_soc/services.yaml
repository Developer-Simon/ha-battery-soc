set_state_of_charge:
  name: Set state of charge
  description: Anchor the coulomb counter to a known state of charge.
  target:
    entity:
      integration: battery_soc
  fields:
    state_of_charge:
      name: State of charge
      description: The known state of charge in percent.
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    bank:
      name: Bank
      description: Which bank to anchor (series topology only).
      required: false
      selector:
        select:
          options:
            - "a"
            - "b"

apply_suggestion:
  name: Apply calibration suggestion
  description: Apply a pending calibration suggestion to the battery configuration.
  fields:
    entry_id:
      name: Config entry
      description: The battery configuration entry.
      required: true
      selector:
        config_entry:
          integration: battery_soc
    key:
      name: Parameter key
      description: The calibration parameter to apply.
      required: true
      selector:
        select:
          options:
            - inverter_dc_ac_efficiency
            - internal_resistance_mohm_per_cell
    unit:
      name: Unit
      description: Optional unit name to scope the suggestion.
      required: false
      selector:
        text:
